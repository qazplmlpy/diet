<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="饮食">
<meta name="theme-color" content="#F2F1F5">
<title>饮食记录</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--bg:#F2F1F5;--card:#FFF;--label:#30325E;--sec:#8A8A99;--ter:#B3B3BE;--sep:#E7E6EC;--blue:#5D6BA8;--green:#8FB0A6;--orange:#E9A6B6;--red:#C5637A;--r:18px}
body{background:var(--bg);color:var(--label);font:15px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC",system-ui,sans-serif;-webkit-font-smoothing:antialiased;padding-bottom:env(safe-area-inset-bottom)}
button,input{font:inherit;-webkit-appearance:none;appearance:none;outline:none;border:none;background:none;color:inherit}
.page{display:none;padding:calc(env(safe-area-inset-top) + 14px) 16px 120px}
.page.on{display:block;animation:in .3s cubic-bezier(.22,1,.36,1)}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:900;display:flex;padding:6px 4px calc(6px + env(safe-area-inset-bottom));background:rgba(255,255,255,.74);backdrop-filter:blur(22px) saturate(180%);-webkit-backdrop-filter:blur(22px) saturate(180%);border-top:.5px solid var(--sep)}
.tab{flex:1;font-size:11px;color:var(--sec);padding:5px 0 3px;display:flex;flex-direction:column;align-items:center;gap:3px;transition:color .2s}
.tab svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tab.on{color:var(--blue);font-weight:600}
.card{background:var(--card);border-radius:var(--r);padding:16px}
.sec{font-size:13px;font-weight:600;color:var(--sec);margin:22px 4px 10px}
.item{background:var(--card);border-radius:var(--r);padding:14px 16px;margin-bottom:10px}
.ih{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.nm{font-size:16px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rt{font-size:15px;font-weight:600;color:var(--blue);font-variant-numeric:tabular-nums;flex-shrink:0}
.sub{font-size:12.5px;color:var(--sec);margin-top:6px;line-height:1.7}
.sub b{color:var(--label)}
.num{font-variant-numeric:tabular-nums}
.addbtn{margin:18px 0 0;padding:15px;text-align:center;background:var(--card);border-radius:var(--r);color:var(--blue);font-weight:600;transition:transform .18s}
.addbtn:active{transform:scale(.98)}
.empty{padding:30px 16px;text-align:center;font-size:13px;color:var(--sec);line-height:1.9}
.list{border-radius:var(--r);overflow:hidden;background:var(--card)}
.bar{height:8px;border-radius:4px;background:var(--sep);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:4px;background:var(--blue);transition:width .35s}
.bar.s{height:5px;border-radius:3px}.bar.s>i{border-radius:3px}
.mask{position:fixed;inset:0;z-index:999;background:rgba(48,50,94,.28);backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px);display:flex;align-items:flex-end;animation:fade .2s}
.mask.center{align-items:center;justify-content:center}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sheet{width:100%;max-height:90vh;overflow-y:auto;background:var(--bg);border-radius:24px 24px 0 0;animation:up .32s cubic-bezier(.22,1,.36,1);padding-bottom:calc(28px + env(safe-area-inset-bottom))}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
.sh{position:sticky;top:0;z-index:2;background:var(--bg);display:flex;justify-content:space-between;align-items:center;padding:16px 18px 10px;font-size:16px}
.sh .t{font-weight:600}.sh .s{color:var(--blue);font-weight:600}.sh [data-close]{color:var(--sec)}
.sb{padding:6px 16px 10px}
.dlg{background:var(--bg);border-radius:20px;padding:20px;width:82%;max-width:330px}
.dlg h3{margin:0 0 16px;font-size:16px}
.dbtns{display:flex;gap:10px;margin-top:18px}
.dbtns button{flex:1;border-radius:12px;padding:13px;background:var(--card);color:var(--sec)}
.dbtns button.p{background:var(--blue);color:#fff;font-weight:600}
.f{margin-bottom:14px;flex:1;min-width:0}
.f label{display:block;font-size:12px;color:var(--sec);margin:0 0 6px 4px}
.f input{width:100%;background:var(--card);border-radius:12px;padding:12px 14px;font-size:16px;font-variant-numeric:tabular-nums}
.f input::placeholder{color:var(--ter)}
.row{display:flex;gap:10px}
.seg{display:flex;background:var(--card);border-radius:12px;padding:3px}
.seg button{flex:1;padding:9px;border-radius:10px;font-size:15px;color:var(--sec)}
.seg button.on{background:var(--blue);color:#fff;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:8px 13px;border-radius:20px;background:var(--card);font-size:13.5px;border:1.5px solid transparent}
.chip.on{border-color:var(--blue);color:var(--blue);font-weight:600}
.danger{margin-top:22px;padding:14px;text-align:center;color:var(--red);background:var(--card);border-radius:14px;font-weight:600}
.dbar{position:relative;display:flex;align-items:center;justify-content:space-between;background:var(--card);border-radius:var(--r);padding:10px 12px;margin-bottom:10px}
.dbar button{font-size:20px;color:var(--blue);width:44px;height:36px}
.dbar button:disabled{color:var(--ter)}
.dbar .d{position:relative;flex:1;text-align:center;font-size:16px;font-weight:600;padding:4px 0}
.dbar .d small{display:block;font-size:11px;color:var(--sec);font-weight:400;margin-top:2px}
.dbar .d input{position:absolute;inset:0;opacity:0;width:100%;height:100%}
.big{font-size:30px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.5px}
.goal{font-size:14px;color:var(--sec)}
.mac{display:flex;gap:12px;margin-top:16px}
.mac>div{flex:1;min-width:0}
.mac .t{font-size:11px;color:var(--sec)}
.mac .v{font-size:14px;font-weight:600;margin-top:3px;font-variant-numeric:tabular-nums}
.mac .v em{font-style:normal;font-size:11px;color:var(--sec);font-weight:400}
.swipe{position:relative;overflow:hidden;border-bottom:1px solid var(--sep)}
.list .swipe:last-child{border-bottom:none}
.swipe .db{position:absolute;right:0;top:0;bottom:0;width:80px;background:var(--red);color:#fff;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600}
.srow{position:relative;background:var(--card);padding:14px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px;transition:transform .22s cubic-bezier(.22,1,.36,1);touch-action:pan-y}
.srow .l{min-width:0;flex:1}
.srow .l .n{font-size:15px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.srow .l .s{font-size:12px;color:var(--sec);margin-top:3px;font-variant-numeric:tabular-nums}
.srow .r{text-align:right;flex-shrink:0}
.srow .r .k{font-size:15px;font-weight:600;font-variant-numeric:tabular-nums}
.srow .r .g{font-size:11px;color:var(--sec)}
.sum{display:flex;gap:12px;margin-bottom:10px}
.sum>div{flex:1;background:var(--card);border-radius:var(--r);padding:16px}
.sum .k{font-size:12px;color:var(--sec)}
.sum .v{font-size:22px;font-weight:600;margin-top:4px;font-variant-numeric:tabular-nums}
  
/* ===== 动效 ===== */
@keyframes popIn{0%{transform:scale(.7);opacity:0}60%{transform:scale(1.06)}100%{transform:scale(1);opacity:1}}
@keyframes riseIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes barGrow{from{width:0}}
@keyframes sweep{from{transform:translateX(-110%)}to{transform:translateX(110%)}}
@keyframes tickIn{0%{transform:scale(.3);opacity:0}55%{transform:scale(1.15)}100%{transform:scale(1);opacity:1}}
@keyframes draw{to{stroke-dashoffset:0}}

.big{animation:popIn .5s cubic-bezier(.22,1,.36,1)}

.bar>i{position:relative;overflow:hidden;animation:barGrow .55s cubic-bezier(.22,1,.36,1)}
.bar>i::after{content:'';position:absolute;inset:0;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.6),transparent);
  animation:sweep .85s .2s cubic-bezier(.22,1,.36,1)}

.list .swipe,#costApp .list>.srow,.item,.sum>div,.card{
  animation:riseIn .42s cubic-bezier(.22,1,.36,1) both}

.tab.on svg{animation:popIn .32s cubic-bezier(.22,1,.36,1)}

.addbtn,.srow,.chip,.seg button{transition:transform .16s cubic-bezier(.22,1,.36,1)}
.addbtn:active,.chip:active,.seg button:active{transform:scale(.94)}
.srow:active{background:rgba(0,0,0,.022)}

.tk{display:flex;align-items:center;justify-content:center;width:22px;height:22px;
  border-radius:50%;background:rgba(255,255,255,.18);
  animation:tickIn .3s cubic-bezier(.22,1,.36,1)}
.tk svg{width:13px;height:13px;fill:none;stroke:#fff;stroke-width:2.4;
  stroke-linecap:round;stroke-linejoin:round}
.tk svg path{stroke-dasharray:26;stroke-dashoffset:26;
  animation:draw .4s .1s cubic-bezier(.22,1,.36,1) forwards}
</style>
</head>
<body>

<section class="page on" id="pg-meal"><div id="mealApp"></div></section>
<section class="page" id="pg-food"><div id="foodApp"></div></section>
<section class="page" id="pg-cost"><div id="costApp"></div></section>
<section class="page" id="pg-weight"><div id="weightApp"></div></section>
<section class="page" id="pg-set"><div id="setApp"></div></section>

<nav class="tabbar">
  <button class="tab on" data-pg="meal">
    <svg viewBox="0 0 24 24"><path d="M3 11h18a9 9 0 0 1-18 0Z"/><path d="M9 7.2 12 11l3-3.8"/></svg>今日</button>
  <button class="tab" data-pg="food">
    <svg viewBox="0 0 24 24"><rect x="3" y="4.5" width="7.5" height="7" rx="2"/><rect x="13.5" y="4.5" width="7.5" height="7" rx="2"/><rect x="3" y="12.5" width="7.5" height="7" rx="2"/><rect x="13.5" y="12.5" width="7.5" height="7" rx="2"/></svg>食物库</button>
  <button class="tab" data-pg="cost">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.8v8.4M9.4 10.3h5.2M9.4 13.2h5.2"/></svg>花费</button>
  <button class="tab" data-pg="weight">
    <svg viewBox="0 0 24 24"><path d="M3 17.5 8.5 11l4 3.2L15.5 8 21 16"/></svg>体重</button>
  <button class="tab" data-pg="set">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.1"/><path d="M3.6 12h2.2M18.2 12h2.2M6.1 6.1l1.6 1.6M16.3 16.3l1.6 1.6M17.9 6.1l-1.6 1.6M7.7 16.3l-1.6 1.6"/></svg>设置</button>
</nav>

<script>
const $=(s,r)=>(r||document).querySelector(s),$$=(s,r)=>[...(r||document).querySelectorAll(s)];
const num=v=>{const n=parseFloat(v);return isFinite(n)?n:0};
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=p=>(p||'x')+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const TODAY=()=>iso(new Date());
const addDays=(s,n)=>{const d=new Date(s+'T00:00:00');d.setDate(d.getDate()+n);return iso(d)};
const pISO=s=>{const a=s.split('-').map(Number);return new Date(a[0],a[1]-1,a[2])};
const WD='日一二三四五六';
const LS={g(k,d){try{const v=JSON.parse(localStorage.getItem('diet::'+k));return v==null?d:v}catch(e){return d}},s(k,v){try{localStorage.setItem('diet::'+k,JSON.stringify(v))}catch(e){}}};

const DEF=[{n:'米饭(熟)',k:116,p:2.6,c:25.9,f:0.3},{n:'鸡胸肉',k:133,p:24.6,c:1,f:3},{n:'鸡蛋',k:144,p:13.3,c:2.8,f:8.8},{n:'全麦面包',k:265,p:9,c:49,f:3.2}];
const DB={foods:LS.g('foods',null),logs:LS.g('logs',[]),cost:LS.g('cost',[]),weights:LS.g('weights',[]),target:LS.g('target',null),profile:LS.g('profile',null)};
if(!Array.isArray(DB.foods)||!DB.foods.length){DB.foods=DEF.map(f=>Object.assign({id:uid('f'),fav:false},f));LS.s('foods',DB.foods)}
if(!DB.target)DB.target={kcal:1400,protein:105,carb:175,fat:31};
if(!DB.profile)DB.profile={height:160,age:25,sex:'f',act:8,minutes:0};

function toast(m,ms){
  ms = ms || 1600;
  const e = document.createElement('div');
  e.innerHTML = '<span class="tk"><svg viewBox="0 0 24 24">'
    + '<path d="M5 12.5 10 17.5 19 7.5"/></svg></span>' + esc(m);
  e.style.cssText = 'position:fixed;left:50%;bottom:100px;transform:translateX(-50%);z-index:2000;'
    + 'display:flex;align-items:center;gap:9px;background:rgba(48,50,94,.92);color:#fff;'
    + 'font-size:14px;padding:10px 18px 10px 12px;border-radius:22px;max-width:80%;'
    + 'pointer-events:none;animation:riseIn .28s cubic-bezier(.22,1,.36,1)';
  document.body.appendChild(e);
  setTimeout(() => { e.style.transition = 'opacity .25s'; e.style.opacity = '0'; }, ms - 250);
  setTimeout(() => e.remove(), ms);
}
function sheet(html){const m=document.createElement('div');m.className='mask';m.innerHTML='<div class="sheet">'+html+'</div>';document.body.appendChild(m);const close=()=>m.remove();m.onclick=e=>{if(e.target===m)close()};$$('[data-close]',m).forEach(b=>b.onclick=close);return{el:m,close,q:s=>m.querySelector(s),qa:s=>$$(s,m)}}
function dlg(html){const m=document.createElement('div');m.className='mask center';m.innerHTML='<div class="dlg">'+html+'</div>';document.body.appendChild(m);const close=()=>m.remove();m.onclick=e=>{if(e.target===m)close()};$$('[data-close]',m).forEach(b=>b.onclick=close);return{el:m,close,q:s=>m.querySelector(s)}}
function swipe(el){let x0=0,y0=0,dx=0,op=false,lk=null;el.addEventListener('touchstart',e=>{if(window.__row&&window.__row!==el)window.__row.style.transform='';x0=e.touches[0].clientX;y0=e.touches[0].clientY;dx=0;lk=null;el.style.transition='none'},{passive:true});el.addEventListener('touchmove',e=>{const mx=e.touches[0].clientX-x0,my=e.touches[0].clientY-y0;if(lk===null)lk=Math.abs(mx)>Math.abs(my)+3?'x':'y';if(lk!=='x')return;dx=Math.max(-96,Math.min(0,op?mx-80:mx));el.style.transform='translateX('+dx+'px)'},{passive:true});el.addEventListener('touchend',()=>{el.style.transition='';op=dx<-40;el.style.transform=op?'translateX(-80px)':'';window.__row=op?el:(window.__row===el?null:window.__row)})}
function go(pg){$$('.page').forEach(p=>p.classList.toggle('on',p.id==='pg-'+pg));$$('.tab').forEach(b=>b.classList.toggle('on',b.dataset.pg===pg));({meal:renderMeal,food:renderFood,cost:renderCost,weight:renderWeight,set:renderSet}[pg]||function(){})();scrollTo(0,0)}
$$('.tab').forEach(b=>b.onclick=()=>go(b.dataset.pg));

/* ---------- 今日饮食 ---------- */
let mDate=TODAY();
const of=d=>DB.logs.filter(l=>l.date===d);
function tot(d){const t={k:0,p:0,c:0,f:0};of(d).forEach(l=>{const r=num(l.gram)/100;t.k+=num(l.k)*r;t.p+=num(l.p)*r;t.c+=num(l.c)*r;t.f+=num(l.f)*r});return t}
function macCell(n,v,g,c){const p=g>0?Math.min(100,v/g*100):0;return '<div><div class="t">'+n+'</div><div class="v">'+v.toFixed(1)+'<em> / '+g+'g</em></div><div class="bar s"><i style="width:'+p+'%;background:'+c+'"></i></div></div>'}
function renderMeal(){
  const b=$('#mealApp');if(!b)return;if(window.__row){window.__row.style.transform='';window.__row=null}
  const t=DB.target,tt=tot(mDate),L=of(mDate),d=pISO(mDate),isT=mDate===TODAY();
  const pc=(a,c)=>c>0?Math.min(100,a/c*100):0;
  b.innerHTML='<div class="dbar"><button id="pv">‹</button><div class="d">'+(d.getMonth()+1)+'月'+d.getDate()+'日 周'+WD[d.getDay()]+'<small>'+(isT?'今天':'补录中')+'</small><input type="date" id="dp" value="'+mDate+'" max="'+TODAY()+'"></div><button id="nx"'+(isT?' disabled':'')+'>›</button></div>'
  +'<div class="card"><div style="display:flex;justify-content:space-between;align-items:flex-start"><div class="big">'+tt.k.toFixed(0)+'<span class="goal"> / '+t.kcal+' kcal</span></div><button id="etgt" style="color:var(--blue);font-size:12.5px;padding:6px 0 6px 10px">改目标</button></div>'
  +'<div class="bar" style="margin-top:12px"><i style="width:'+pc(tt.k,t.kcal)+'%;background:'+(tt.k>t.kcal?'var(--red)':'var(--blue)')+'"></i></div>'
  +'<div class="mac">'+macCell('蛋白',tt.p,t.protein,'var(--blue)')+macCell('碳水',tt.c,t.carb,'var(--green)')+macCell('脂肪',tt.f,t.fat,'var(--orange)')+'</div>'
  +'<div class="sub" style="margin-top:16px;padding-top:12px;border-top:1px solid var(--sep)">还差 <b>'+Math.max(0,t.kcal-tt.k).toFixed(0)+'</b> kcal · 蛋白 <b>'+Math.max(0,t.protein-tt.p).toFixed(0)+'</b> g · 碳水 <b>'+Math.max(0,t.carb-tt.c).toFixed(0)+'</b> g · 脂肪 <b>'+Math.max(0,t.fat-tt.f).toFixed(0)+'</b> g</div></div>'
  +'<div class="sec">'+(isT?'今天':'这天')+'吃了 '+L.length+' 条</div><div class="list">'
  +(L.length?L.map(l=>{const r=num(l.gram)/100;return '<div class="swipe"><div class="db" data-del="'+l.id+'">删除</div><div class="srow" data-r="'+l.id+'"><div class="l"><div class="n">'+esc(l.name)+'</div><div class="s">'+num(l.gram)+'g · 蛋白 '+(num(l.p)*r).toFixed(1)+' · 碳水 '+(num(l.c)*r).toFixed(1)+' · 脂肪 '+(num(l.f)*r).toFixed(1)+'</div></div><div class="r"><div class="k">'+(num(l.k)*r).toFixed(0)+'</div><div class="g">kcal</div></div></div></div>'}).join(''):'<div class="empty">还没有记录<br>点下面「＋ 记一笔」</div>')
  +'</div><div class="addbtn" id="madd">＋ 记一笔</div>';
  $('#pv').onclick=()=>{mDate=addDays(mDate,-1);renderMeal()};
  const nx=$('#nx');if(nx)nx.onclick=()=>{const n=addDays(mDate,1);if(n<=TODAY()){mDate=n;renderMeal()}};
  $('#dp').onchange=e=>{if(e.target.value&&e.target.value<=TODAY()){mDate=e.target.value;renderMeal()}};
  $('#madd').onclick=()=>mealEditor(null);
  $('#etgt').onclick=tgtEditor;
  $$('[data-del]',b).forEach(e=>e.onclick=()=>{DB.logs=DB.logs.filter(x=>x.id!==e.dataset.del);LS.s('logs',DB.logs);renderMeal();toast('已删除')});
  $$('.srow',b).forEach(e=>{swipe(e);e.onclick=()=>{if(!window.__row)mealEditor(e.dataset.r)}});
}
function mealEditor(id){
  const ed=id?DB.logs.find(x=>x.id===id):null,d=ed||{name:'',gram:'',k:'',p:'',c:'',f:''};
  const ch=DB.foods.slice().sort((a,b)=>(b.fav?1:0)-(a.fav?1:0)).slice(0,12);
  const s=sheet('<div class="sh"><button data-close>取消</button><span class="t">'+(ed?'编辑记录':'记一笔')+'</span><span class="s" id="ok">保存</span></div><div class="sb">'
  +(ch.length?'<div class="f"><label>食物库（点一下自动填）</label><div class="chips">'+ch.map(f=>'<div class="chip" data-f="'+f.id+'">'+esc(f.n)+'</div>').join('')+'</div></div>':'')
  +'<div class="f"><label>吃了什么</label><input id="a_name" placeholder="名称" value="'+esc(d.name)+'"></div>'
  +'<div class="f"><label>克数</label><input id="a_gram" type="number" inputmode="decimal" placeholder="150" value="'+esc(d.gram)+'"></div>'
  +'<div class="sec" style="margin:16px 4px 10px">每 100g 营养</div>'
  +'<div class="row"><div class="f"><label>热量 kcal</label><input id="a_k" type="number" inputmode="decimal" value="'+esc(d.k)+'"></div><div class="f"><label>蛋白 g</label><input id="a_p" type="number" inputmode="decimal" value="'+esc(d.p)+'"></div></div>'
  +'<div class="row"><div class="f"><label>碳水 g</label><input id="a_c" type="number" inputmode="decimal" value="'+esc(d.c)+'"></div><div class="f"><label>脂肪 g</label><input id="a_f" type="number" inputmode="decimal" value="'+esc(d.f)+'"></div></div>'

  const perDay=unit*daily,stock=(it.stockGram===''||it.stockGram==null)?total:num(it.stockGram);
  return{pg:pg,pcn:pcn,daily:daily,total:total,unit100:unit*100,perDay:perDay,perMonth:perDay*30,stock:stock,daysTotal:daily>0?total/daily:0,daysLeft:daily>0?stock/daily:0};

/* ---------- 体重 ---------- */
function bmiOf(kg){const h=num(DB.profile.height)/100;return h>0?kg/(h*h):0}
function bmiL(v){if(!v)return'';if(v<18.5)return'偏瘦';if(v<24)return'正常';if(v<28)return'偏胖';return'肥胖'}
function wkFb(){
  const ws=DB.weights.slice().sort((a,b)=>a.date<b.date?-1:1);if(ws.length<2)return null;
  const last=ws[ws.length-1],goal=addDays(last.date,-7);let prev=null;
  for(let i=ws.length-2;i>=0;i--){if(ws[i].date<=goal){prev=ws[i];break}}
  if(!prev)prev=ws[0];if(!prev||prev.date===last.date)return null;
  const days=Math.max(1,Math.round((pISO(last.date)-pISO(prev.date))/86400000));
  const dKg=prev.kg-last.kg,wk=prev.kg>0?(dKg/prev.kg)/days*7:0;
  let kind,title,msg,sug=null;
  if(wk>=0.01){kind='warn';title='降得太快了';msg='每周降 '+(wk*100).toFixed(1)+'%，超过 1%。按规则：保持当前目标，别急着减。'}
  else if(wk>=0.005){kind='ok';title='节奏刚好';msg='每周降 '+(wk*100).toFixed(1)+'%，落在 0.5%–1%。按规则：保持不变，继续。'}
  else{kind='slow';title='掉得有点慢';const nc=Math.max(80,num(DB.target.carb)-20);sug=nc;msg=(dKg>0?'每周只降 ':'体重没降，')+(Math.abs(wk)*100).toFixed(1)+'%，不足 0.5%。按规则：碳水 −20g → <b>'+nc+'g</b>（蛋白脂肪不动）。'+(num(DB.target.carb)<=80?' 已在下限 80g，不再减了。':'')}
  return{last:last,prev:prev,days:days,dKg:dKg,wk:wk,kind:kind,title:title,msg:msg,sug:sug};
}
function trend(cv,pts){
  const dpr=window.devicePixelRatio||1,w=cv.clientWidth||300,h=150;
  cv.width=Math.round(w*dpr);cv.height=Math.round(h*dpr);cv.style.height=h+'px';
  const g=cv.getContext('2d');g.setTransform(dpr,0,0,dpr,0,0);g.clearRect(0,0,w,h);
  if(pts.length<2){g.fillStyle='#B3B3BE';g.font='13px -apple-system,sans-serif';g.textAlign='center';g.fillText('记两次以上就能看到趋势',w/2,h/2);return}
  const pad=24,iw=w-pad*2,ih=h-pad*2,ks=pts.map(p=>p.kg);
  let mn=Math.min.apply(null,ks),mx=Math.max.apply(null,ks);
  if(mx-mn<1){const m=(mx+mn)/2;mn=m-.5;mx=m+.5}
  const X=i=>pad+iw*i/(pts.length-1),Y=v=>pad+ih*(1-(v-mn)/(mx-mn));
  const lg=g.createLinearGradient(0,pad,0,pad+ih);lg.addColorStop(0,'rgba(93,107,168,.2)');lg.addColorStop(1,'rgba(93,107,168,0)');
  g.beginPath();g.moveTo(X(0),Y(pts[0].kg));pts.forEach((p,i)=>{if(i)g.lineTo(X(i),Y(p.kg))});
  g.lineTo(X(pts.length-1),pad+ih);g.lineTo(X(0),pad+ih);g.closePath();g.fillStyle=lg;g.fill();
  g.beginPath();g.moveTo(X(0),Y(pts[0].kg));pts.forEach((p,i)=>{if(i)g.lineTo(X(i),Y(p.kg))});
  g.strokeStyle='#5D6BA8';g.lineWidth=2.2;g.lineJoin='round';g.lineCap='round';g.stroke();
  pts.forEach((p,i)=>{if(pts.length>14&&i!==pts.length-1&&i%2)return;const L=i===pts.length-1;g.beginPath();g.arc(X(i),Y(p.kg),L?4.5:2.8,0,Math.PI*2);g.fillStyle=L?'#5D6BA8':'#fff';g.fill();if(!L){g.strokeStyle='#5D6BA8';g.lineWidth=2;g.stroke()}});
  g.fillStyle='#8A8A99';g.font='11px -apple-system,sans-serif';g.textAlign='left';
  g.fillText(mx.toFixed(1),pad-6,pad-8);g.fillText(mn.toFixed(1),pad-6,pad+ih+14);
}
function renderWeight(){
  const b=$('#weightApp');if(!b)return;if(window.__row){window.__row.style.transform='';window.__row=null}
  const ws=DB.weights.slice().sort((a,c)=>a.date<c.date?-1:1),last=ws[ws.length-1],fb=wkFb();

  if(fb){

    const bg=fb.kind==='ok'?'rgba(143,176,166,.14)':fb.kind==='warn'?'rgba(197,99,122,.1)':'rgba(233,166,182,.18)';
    h+='<div class="sec">7 天反馈</div><div class="item" style="background:'+bg+'"><div class="ih"><div class="nm" style="color:'+cc+'">'+fb.title+'</div><div class="rt" style="color:'+cc+'">'+(fb.dKg>=0?'−':'+')+Math.abs(fb.dKg).toFixed(1)+' kg</div></div><div class="sub">对比 '+fb.prev.date+'（'+fb.prev.kg+' kg）· 间隔 '+fb.days+' 天<br>'+fb.msg+'</div><div class="sub">当前目标：'+DB.target.kcal+' kcal ｜ 碳水 '+DB.target.carb+' g</div>'+(fb.sug!=null&&fb.sug<num(DB.target.carb)?'<div class="addbtn" id="w_ap" style="margin-top:14px;background:rgba(255,255,255,.72);padding:12px">应用：碳水改为 '+fb.sug+' g</div>':'')+'</div>';
  }
  h+='<div class="sec">趋势</div><div class="card"><canvas id="w_cv" style="width:100%;display:block"></canvas></div>';
  h+='<div class="sec">记录（'+ws.length+'）</div><div class="list">'+(ws.length?ws.slice().reverse().map(w=>'<div class="swipe"><div class="db" data-del="'+w.id+'">删除</div><div class="srow" data-r="'+w.id+'"><div class="l"><div class="n">'+num(w.kg).toFixed(1)+' kg</div><div class="s">'+w.date+(w.note?' · '+esc(w.note):'')+'</div></div><div class="r"><div class="g">BMI '+(bmiOf(num(w.kg))?bmiOf(num(w.kg)).toFixed(1):'—')+'</div></div></div></div>').join(''):'<div class="empty">还没有记录<br>点下面「＋ 记体重」</div>')+'</div><div class="addbtn" id="wadd">＋ 记体重</div>';
  b.innerHTML=h;
  const cv=$('#w_cv',b);if(cv){const pts=ws.slice(-30).map(w=>({date:w.date,kg:num(w.kg)})).filter(p=>p.kg>0);requestAnimationFrame(()=>trend(cv,pts))}
  const ap=$('#w_ap',b);if(ap)ap.onclick=()=>{DB.target.carb=fb.sug;DB.target.kcal=Math.max(0,num(DB.target.kcal)-80);LS.s('target',DB.target);renderWeight();toast('碳水已改为 '+fb.sug+' g')};
  $('#wadd',b).onclick=()=>weightEditor(null);
  $$('[data-del]',b).forEach(e=>e.onclick=()=>{DB.weights=DB.weights.filter(x=>x.id!==e.dataset.del);LS.s('weights',DB.weights);renderWeight();toast('已删除')});
  $$('.srow',b).forEach(e=>{swipe(e);e.onclick=()=>{if(!window.__row)weightEditor(e.dataset.r)}});
}
function weightEditor(id){
  const ed=id?DB.weights.find(x=>x.id===id):null;
  const so=DB.weights.slice().sort((a,c)=>a.date<c.date?-1:1),last=so[so.length-1];
  const d=ed||{date:TODAY(),kg:'',note:''};
  const s=sheet('<div class="sh"><button data-close>取消</button><span class="t">'+(ed?'编辑体重':'记体重')+'</span><span class="s" id="ok">保存</span></div><div class="sb">'
  +'<div class="f"><label>日期</label><input id="w_dt" type="date" value="'+d.date+'" max="'+TODAY()+'"></div>'
  +'<div class="f"><label>体重 kg</label><input id="w_kg" type="number" inputmode="decimal" step="0.1" placeholder="'+(last?num(last.kg):'55.0')+'" value="'+(d.kg===''?'':esc(d.kg))+'"></div>'
  +'<div class="f"><label>备注（可留空）</label><input id="w_nt" placeholder="早上空腹" value="'+esc(d.note||'')+'"></div>'
  +(ed?'<div class="danger" id="del">删除这条</div>':'')+'</div>');
  $('#ok',s.el).onclick=()=>{
    const kg=num(s.q('#w_kg').value);if(kg<=0){s.q('#w_kg').focus();toast('填一下体重');return}
    const o={id:ed?ed.id:uid('w'),date:s.q('#w_dt').value||TODAY(),kg:kg,note:s.q('#w_nt').value.trim()};
    if(ed)DB.weights[DB.weights.findIndex(x=>x.id===ed.id)]=o;else DB.weights.push(o);
    LS.s('weights',DB.weights);s.close();renderWeight();toast('已记录')};
  const dl=$('#del',s.el);if(dl)dl.onclick=()=>{DB.weights=DB.weights.filter(x=>x.id!==ed.id);LS.s('weights',DB.weights);s.close();renderWeight();toast('已删除')};
}

/* ---------- 设置 ---------- */
function sugTgt(){
  const p=DB.profile,ws=DB.weights.slice().sort((a,b)=>a.date<b.date?-1:1);
  const kg=ws.length?num(ws[ws.length-1].kg):55;
  const sex=p.sex==='m'?5:-161;
  const bmr=10*kg+6.25*num(p.height)-5*num(p.age)+sex;
  const kcal=Math.max(1000,Math.round(bmr+num(p.minutes)*num(p.act)));
  return{kcal:kcal,protein:Math.round(kcal*.3/4),carb:Math.max(80,Math.round(kcal*.5/4)),fat:Math.round(kcal*.2/9),bmr:Math.round(bmr)};
}
function renderSet(){
  const b=$('#setApp');if(!b)return;const p=DB.profile,t=DB.target;
  b.innerHTML='<div class="card"><div class="row"><div class="f"><label>身高 cm</label><input id="s_h" type="number" inputmode="decimal" value="'+p.height+'"></div><div class="f"><label>年龄</label><input id="s_a" type="number" inputmode="decimal" value="'+p.age+'"></div></div>'
  +'<div class="row"><div class="f"><label>性别</label><div class="seg"><button data-sex="f" class="'+(p.sex==='m'?'':'on')+'">女</button><button data-sex="m" class="'+(p.sex==='m'?'on':'')+'">男</button></div></div>'
  +'<div class="f"><label>训练强度</label><div class="seg"><button data-act="5" class="'+(num(p.act)===5?'on':'')+'">新手</button><button data-act="8" class="'+(num(p.act)===8?'on':'')+'">普通</button><button data-act="10" class="'+(num(p.act)===10?'on':'')+'">强</button></div></div></div>'
  +'<div class="f"><label>每天训练多少分钟（不运动填 0）</label><input id="s_m" type="number" inputmode="decimal" value="'+num(p.minutes)+'"></div>'
  +'<div id="pv" class="sub"></div>'
  +'<div class="addbtn" id="s_ap" style="margin-top:14px">按 5:3:2 算出并应用</div></div>'
  +'<div class="sec">当前目标</div><div class="item" id="s_t"><div class="ih"><div class="nm">每日目标</div><div class="rt">改 ›</div></div><div class="sub">热量 <b>'+t.kcal+'</b> kcal<br>蛋白 <b>'+t.protein+'</b> g ｜ 碳水 <b>'+t.carb+'</b> g ｜ 脂肪 <b>'+t.fat+'</b> g</div></div>'
  +'<div class="sec">数据</div><div class="list"><div class="srow" id="s_ex"><div class="l"><div class="n">导出数据</div><div class="s">生成一段文本，复制保存到备忘录</div></div><div class="r"><div class="g">›</div></div></div><div class="srow" id="s_im"><div class="l"><div class="n">导入数据</div><div class="s">粘贴之前导出的文本</div></div><div class="r"><div class="g">›</div></div></div></div>'
  +'<div class="danger" id="s_cl">清空全部数据</div>'
  +'<div class="sub" style="text-align:center;color:var(--ter);margin:20px 0 0">数据只存在这台手机上<br>清理 Safari 数据会丢失，记得偶尔导出</div>';
  const pv=()=>{const bak=DB.profile;DB.profile={height:num($('#s_h').value)||p.height,age:num($('#s_a').value)||p.age,sex:p.sex,minutes:num($('#s_m').value),act:num(p.act)};const r=sugTgt();DB.profile=bak;$('#pv').innerHTML='基础代谢约 <b>'+r.bmr+'</b> kcal → 建议 <b>'+r.kcal+'</b> kcal ｜ 碳水 <b>'+r.carb+'</b> g · 蛋白 <b>'+r.protein+'</b> g · 脂肪 <b>'+r.fat+'</b> g'};
  ['s_h','s_a','s_m'].forEach(id=>$('#'+id).oninput=pv);
  $$('[data-sex]',b).forEach(x=>x.onclick=()=>{p.sex=x.dataset.sex;LS.s('profile',p);renderSet()});
  $$('[data-act]',b).forEach(x=>x.onclick=()=>{p.act=num(x.dataset.act);LS.s('profile',p);renderSet()});
  $('#s_ap',b).onclick=()=>{p.height=num($('#s_h').value)||p.height;p.age=num($('#s_a').value)||p.age;p.minutes=num($('#s_m').value);LS.s('profile',p);const r=sugTgt();DB.target={kcal:r.kcal,protein:r.protein,carb:r.carb,fat:r.fat};LS.s('target',DB.target);renderSet();toast('已按 5:3:2 更新目标')};
  $('#s_t',b).onclick=()=>tgtEditor();
  $('#s_ex',b).onclick=expData;
  $('#s_im',b).onclick=impData;
  $('#s_cl',b).onclick=()=>{const d=dlg('<h3>清空全部数据？</h3><div class="sub" style="margin:-6px 0 0">饮食记录、食物库、花费、体重、目标，全都没了，且无法恢复。</div><div class="dbtns"><button data-close>取消</button><button class="p" id="ok" style="background:var(--red);color:#fff">清空</button></div>');$('#ok',d.el).onclick=()=>{['foods','logs','cost','weights','target','profile'].forEach(k=>localStorage.removeItem('diet::'+k));d.close();location.reload()}};
  pv();
}
function expData(){
  const txt=JSON.stringify({v:1,foods:DB.foods,logs:DB.logs,cost:DB.cost,weights:DB.weights,target:DB.target,profile:DB.profile});
  const s=sheet('<div class="sh"><button data-close>关闭</button><span class="t">导出数据</span><span class="s" id="cp">复制</span></div><div class="sb"><div class="sub" style="margin:0 0 10px">全选下面这段，复制到备忘录存着。以后换手机或数据丢了，用它导入就能恢复。</div><textarea id="ta" readonly style="width:100%;height:38vh;border-radius:14px;background:var(--card);padding:14px;font-size:12px;color:var(--sec);font-family:ui-monospace,Menlo,monospace;line-height:1.5;resize:none">'+esc(txt)+'</textarea></div>');
  $('#cp',s.el).onclick=()=>{const ta=$('#ta',s.el);ta.removeAttribute('readonly');ta.focus();ta.select();ta.setSelectionRange(0,999999);try{const ok=document.execCommand('copy');toast(ok?'已复制':'请长按选中后复制')}catch(e){toast('请长按选中后复制')}ta.setAttribute('readonly','readonly')};
}
function impData(){
  const s=sheet('<div class="sh"><button data-close>取消</button><span class="t">导入数据</span><span class="s" id="ok">导入</span></div><div class="sb"><div class="sub" style="margin:0 0 10px">把之前导出的那段文本粘进来。注意：会覆盖现在所有数据。</div><textarea id="ta" placeholder="在这里粘贴…" style="width:100%;height:34vh;border-radius:14px;background:var(--card);padding:14px;font-size:12px;font-family:ui-monospace,Menlo,monospace;line-height:1.5;resize:none"></textarea></div>');
  $('#ok',s.el).onclick=()=>{
    const raw=$('#ta',s.el).value.trim();if(!raw){toast('还没粘贴');return}
    let o;try{o=JSON.parse(raw)}catch(e){toast('这段文本不对');return}
    if(!o||typeof o!=='object'){toast('这段文本不对');return}
    if(Array.isArray(o.foods)){DB.foods=o.foods;LS.s('foods',DB.foods)}
    if(Array.isArray(o.logs)){DB.logs=o.logs;LS.s('logs',DB.logs)}
    if(Array.isArray(o.cost)){DB.cost=o.cost;LS.s('cost',DB.cost)}
    if(Array.isArray(o.weights)){DB.weights=o.weights;LS.s('weights',DB.weights)}
    if(o.target){DB.target=o.target;LS.s('target',DB.target)}
    if(o.profile){DB.profile=o.profile;LS.s('profile',DB.profile)}
    s.close();go('meal');toast('导入完成')};
}


/* ===== 动效 JS ===== */
let __prevK = 0;

function animateBig(){
  const el = $('#mealApp .big');
  if(!el || !el.firstChild) return;
  const node = el.firstChild;
  const to = parseFloat(node.nodeValue);
  if(!isFinite(to)) return;
  const from = __prevK;
  __prevK = to;
  if(Math.abs(to - from) < 1) return;
  const t0 = performance.now(), dur = 550;
  (function step(now){
    const p = Math.min(1, (now - t0) / dur);
    const e = 1 - Math.pow(1 - p, 3);
    node.nodeValue = String(Math.round(from + (to - from) * e));
    if(p < 1) requestAnimationFrame(step);
    else node.nodeValue = String(Math.round(to));
  })(t0);
}

function stagger(){
  $$('.list .swipe, #costApp .list>.srow, .item, .sum>div').forEach((el, i) => {
    el.style.animationDelay = Math.min(i * 30, 280) + 'ms';
  });
}

['renderMeal','renderFood','renderWeight','renderCost','renderSet'].forEach(n => {
  const f = window[n];
  if(typeof f !== 'function') return;
  window[n] = function(){
    f.apply(this, arguments);
    requestAnimationFrame(() => { stagger(); if(n === 'renderMeal') animateBig(); });
  };
});
  
renderMeal();
</script>
