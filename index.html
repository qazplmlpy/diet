<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#F2F1F5">
<title>饮食记录</title>
<style>
:root{
  --bg:#F2F1F5;--card:#FFFFFF;--label:#30325E;--sec:#8A8A99;--ter:#B3B3BE;
  --sep:#E7E6EC;--blue:#5D6BA8;--green:#8FB0A6;--orange:#E9A6B6;
  --red:#C5637A;--purple:#A8A5B5;--r:16px;--ease:cubic-bezier(.32,.72,0,1);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{font:16px/1.42 -apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",sans-serif;
  background:var(--bg);color:var(--label);overflow:hidden;-webkit-font-smoothing:antialiased}
input,button,textarea{font-family:inherit;font-size:inherit;color:inherit}
input{-webkit-appearance:none;appearance:none;border:none;background:none;outline:none;border-radius:0}
button{border:none;background:none;cursor:pointer;color:inherit}
.pages{position:fixed;inset:0;overflow:hidden;background:var(--bg)}
.page{position:absolute;top:0;left:0;right:0;bottom:0;overflow-y:auto;overflow-x:hidden;
  -webkit-overflow-scrolling:touch;
  padding:calc(18px + env(safe-area-inset-top)) 16px calc(28px + env(safe-area-inset-bottom));
  background:var(--bg);transform:translateX(100%);will-change:transform;z-index:1}
.page.active{transform:translateX(0);z-index:2}
.tabbar{position:fixed;left:0;right:0;bottom:0;display:flex;
  height:calc(52px + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);
  background:rgba(251,250,252,.94);
  -webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);
  border-top:.5px solid rgba(48,50,94,.10);z-index:100}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  color:var(--sec);padding-top:5px;transition:color .18s ease}
.tab.on{color:var(--blue)}
.tab svg{width:24px;height:24px;transition:transform .24s var(--ease)}
.tab.on svg{transform:scale(1.07)}
.tab span{font-size:10px;font-weight:500}
.h1{font-size:31px;font-weight:700;letter-spacing:-.5px;line-height:1.15;margin-bottom:16px}
.h1 small{display:block;font-size:13px;font-weight:400;color:var(--sec);letter-spacing:0;margin-top:4px}
.h2{font-size:13px;color:var(--sec);font-weight:500;margin:20px 4px 8px}
.card{background:var(--card);border-radius:var(--r);padding:16px;margin-bottom:14px;
  box-shadow:0 1px 3px rgba(48,50,94,.05)}
.card.pl{padding:0;overflow:hidden}
.row{display:flex;align-items:center;gap:10px;padding:13px 16px;min-height:50px;
  border-bottom:.5px solid var(--sep)}
.row:last-child{border-bottom:none}
.row .g{flex:1;min-width:0}
.row .t{font-size:17px;letter-spacing:-.2px}
.row .s{font-size:13px;color:var(--sec);margin-top:3px;line-height:1.35}
.row .v{font-size:16px;color:var(--sec);white-space:nowrap;flex:0 0 auto}
.row.ck{cursor:pointer;transition:background .16s ease}
.row.ck:active{background:rgba(48,50,94,.045)}
.row .ar{font-size:19px;color:var(--ter);flex:0 0 auto;margin-top:-2px}
.field{display:flex;align-items:center;padding:13px 16px;min-height:50px;
  border-bottom:.5px solid var(--sep)}
.field:last-child{border-bottom:none}
.field>label{flex:1;font-size:17px;letter-spacing:-.2px}
.field input{text-align:right;font-size:17px;width:130px;flex:0 0 auto}
.field .u{font-size:17px;color:var(--sec);min-width:30px;text-align:right;margin-left:4px}
.bar{height:8px;background:#EAE9F0;border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:4px;transition:width .45s var(--ease)}
.btn{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;height:50px;
  border-radius:12px;background:var(--blue);color:#fff;font-size:17px;font-weight:600;margin-top:10px;
  transition:transform .12s ease,opacity .12s ease}
.btn:active{transform:scale(.974);opacity:.86}
.btn.sec{background:#ECEBF2;color:var(--blue)}
.btn.dg{background:#FAE7EB;color:var(--red)}
.btn.sm{height:36px;font-size:15px;width:auto;padding:0 16px;margin:0;border-radius:10px}
.empty{text-align:center;padding:34px 20px;color:var(--sec)}
.empty svg{width:38px;height:38px;color:var(--ter);margin-bottom:10px}
.empty b{display:block;font-size:15px;font-weight:600;color:var(--sec)}
.empty p{font-size:13px;color:var(--ter);margin-top:5px;line-height:1.5}
.sheet{position:fixed;inset:0;background:var(--bg);z-index:200;display:flex;flex-direction:column;
  transform:translateY(100%);transition:transform .38s var(--ease),visibility .38s;visibility:hidden}
.sheet.on{transform:translateY(0);visibility:visible}
.shd{display:flex;align-items:center;justify-content:space-between;
  padding:calc(14px + env(safe-area-inset-top)) 16px 14px;
  background:rgba(242,241,245,.94);
  -webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);
  border-bottom:.5px solid rgba(48,50,94,.08);flex:0 0 auto}
.shd button{font-size:17px;color:var(--blue);min-width:54px;text-align:left}
.shd button.r{text-align:right;font-weight:600}
.shd button:disabled{opacity:.32}
.shd b{flex:1;text-align:center;font-size:17px;font-weight:600;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap;padding:0 6px}
.sbd{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px;
  padding-bottom:calc(48px + env(safe-area-inset-bottom))}
.search{display:flex;align-items:center;gap:8px;background:#ECEBF2;border-radius:10px;
  padding:0 11px;height:38px;margin:14px 16px}
.search svg{width:17px;height:17px;color:var(--sec);flex:0 0 auto}
.search input{flex:1;font-size:16px}
.search .clr{color:var(--ter);font-size:17px;padding:4px}
.big{font-size:42px;font-weight:700;letter-spacing:-1.2px;text-align:center;line-height:1.1}
.mid{font-weight:600}
.gray{color:var(--sec)}
.tip{font-size:13px;color:var(--sec);line-height:1.55;margin:10px 4px 0}
.between{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.caps{font-size:13px;font-weight:600;color:var(--sec);letter-spacing:.02em}
.smw{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
</style>
</head>
<body>
<div class="pages" id="pages">
  <section class="page active" data-p="today"></section>
  <section class="page" data-p="foods"></section>
  <section class="page" data-p="cost"></section>
  <section class="page" data-p="weight"></section>
  <section class="page" data-p="set"></section>
</div>
<nav class="tabbar" id="tabbar"></nav>
<script>
var ICON={
  today:'<rect x="3" y="4.5" width="18" height="16.5" rx="3.5"/><path d="M3 10h18"/><path d="M8 2.5v4M16 2.5v4"/>',
  foods:'<path d="M11.5 20.5A7.5 7.5 0 0 1 10 6.2C16 5 17.5 4.4 19.5 2c1 2 2 4.3 2 8.2 0 5.8-5 10.3-10 10.3z"/><path d="M2.5 21.5c0-3.2 2-5.7 5.4-6.3 2.5-.5 5.1-2.1 6.1-3.2"/>',
  cost:'<rect x="3" y="6" width="18" height="13" rx="3"/><path d="M3 10h18"/><circle cx="16" cy="14" r="1.3" fill="currentColor" stroke="none"/>',
  weight:'<circle cx="12" cy="12" r="9"/><path d="M12 12.5l4.3-3.6"/><circle cx="12" cy="12.5" r="1.3" fill="currentColor" stroke="none"/>',
  set:'<circle cx="12" cy="12" r="3.2"/><path d="M19.1 14.9a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.9 2.9l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.9-2.9l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.9-2.9l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.9 2.9l-.1.1a1.7 1.7 0 0 0-.3 1.9V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',
  chev:'<path d="M9 5l7 7-7 7"/>',
  search:'<circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/>',
  wallet:'<rect x="3" y="6" width="18" height="13" rx="3"/><path d="M3 10h18"/>',
  bowl:'<path d="M3 11h18a9 9 0 0 1-9 9 9 9 0 0 1-9-9z"/><path d="M12 8V3"/>'
};
function ic(n,s){return '<svg viewBox="0 0 24 24" width="'+(s||24)+'" height="'+(s||24)+'" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">'+(ICON[n]||'')+'</svg>';}

var TABS=[
  {k:'today',n:'今日',i:'today'},{k:'foods',n:'食物',i:'foods'},
  {k:'cost',n:'花费',i:'cost'},{k:'weight',n:'体重',i:'weight'},{k:'set',n:'设置',i:'set'}
];
document.getElementById('tabbar').innerHTML=TABS.map(function(t,i){
  return '<button class="tab'+(i===0?' on':'')+'" data-i="'+i+'">'+ic(t.i)+'<span>'+t.n+'</span></button>';
}).join('');

var pageEls=[].slice.call(document.querySelectorAll('.page'));
var cur=0,busy=false;

function go(idx){
  if(idx===cur||busy||idx<0||idx>=pageEls.length)return;
  var a=pageEls[cur],b=pageEls[idx],dir=idx>cur?1:-1;
  busy=true;
  b.style.transition='none';b.style.transform='translateX('+(dir*100)+'%)';b.style.zIndex=3;
  a.style.transition='none';a.style.transform='translateX(0)';a.style.zIndex=2;
  void b.offsetWidth;
  var E='cubic-bezier(.32,.72,0,1)';
  b.style.transition='transform .34s '+E;
  a.style.transition='transform .34s '+E+', opacity .34s ease';
  b.style.transform='translateX(0)';
  a.style.transform='translateX('+(dir*-28)+'%)';a.style.opacity='.35';
  setTimeout(function(){
    a.style.transition='none';a.style.transform='translateX(100%)';
    a.style.opacity='1';a.style.zIndex=1;b.style.zIndex=2;busy=false;
  },350);
  cur=idx;
  document.querySelectorAll('.tab').forEach(function(x,i){x.classList.toggle('on',i===idx);});
}
document.getElementById('tabbar').addEventListener('click',function(e){
  var b=e.target.closest('.tab');
  if(b)go(+b.dataset.i);
});

function pad(n){return(n<10?'0':'')+n;}
function dkey(d){d=d||new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function dparse(k){var a=k.split('-').map(Number);return new Date(a[0],a[1]-1,a[2]);}
function dshift(k,n){var d=dparse(k);d.setDate(d.getDate()+n);return dkey(d);}
function dfmt(k){var d=dparse(k);return(d.getMonth()+1)+'月'+d.getDate()+'日';}
function wcn(k){return'日一二三四五六'[dparse(k).getDay()];}
function ddiff(a,b){return Math.round((dparse(b)-dparse(a))/86400000);}
function r1(n){return Math.round(n*10)/10;}
function r2(n){return Math.round(n*100)/100;}
function num(v){var n=parseFloat(String(v).replace(',','.'));return isNaN(n)?0:n;}
function uid(p){return p+Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function bar(v,t,c,h){
  h=h||8;
  var pc=t>0?Math.min(v/t,1)*100:0,over=t>0&&v>t;
  return '<div class="bar" style="height:'+h+'px;border-radius:'+(h/2)+'px"><i style="width:'+pc.toFixed(1)+'%;background:'+(over?'var(--red)':c)+'"></i></div>';
}

var DF=[
  ['混合坚果',600,20,20,50],['鸡胸肉（熟）',165,31,0,3.6],['白米饭（熟）',116,2.6,25.9,0.3],
  ['鸡蛋',143,12.6,0.7,9.5],['全麦面包',247,13,41,3.4],['牛奶',61,3.2,4.8,3.3],
  ['燕麦片',380,13,67,7],['西兰花',34,2.8,7,0.4],['苹果',52,0.3,14,0.2],
  ['香蕉',89,1.1,23,0.3],['瘦牛肉',250,26,0,15],['三文鱼',208,20,0,13],
  ['无糖酸奶',59,10,3.6,0.4],['花生酱',588,25,20,50],['蛋白粉',380,80,5,3]
];
var META=[
  {k:'p',n:'蛋白质',c:'var(--blue)'},
  {k:'c',n:'碳水',c:'var(--green)'},
  {k:'f',n:'脂肪',c:'var(--purple)'}
];
var KEY='diet_v2';
function makeFoods(){return DF.map(function(a,i){return{id:'b'+i,n:a[0],k:a[1],p:a[2],c:a[3],f:a[4],own:false};});}
function blank(){
  return{goals:{kcal:1800,p:120,c:200,f:60,height:0,target:0},
    foods:makeFoods(),log:[],costs:[],weights:[],plan:null};
}
var DB;
try{DB=JSON.parse(localStorage.getItem(KEY));}catch(e){}
if(!DB||!DB.foods)DB=blank();
['goals','foods','log','costs','weights'].forEach(function(k){if(!DB[k])DB[k]=blank()[k];});
function save(){try{localStorage.setItem(KEY,JSON.stringify(DB));}catch(e){}}
function sumLog(l){return l.reduce(function(a,e){a.k+=e.k;a.p+=e.p;a.c+=e.c;a.f+=e.f;return a;},{k:0,p:0,c:0,f:0});}

var sheetEl=document.createElement('div');
sheetEl.className='sheet';
sheetEl.innerHTML='<div class="shd"><button class="l">取消</button><b></b><button class="r">保存</button></div><div class="sbd"></div>';
document.body.appendChild(sheetEl);
var shdL=sheetEl.querySelector('.shd .l'),shdT=sheetEl.querySelector('.shd b'),
    shdR=sheetEl.querySelector('.shd .r'),sbd=sheetEl.querySelector('.sbd');
function canSave(ok){shdR.disabled=!ok;}
function sheet(o){
  shdT.textContent=o.title||'';
  sbd.innerHTML=o.body||'';
  sbd.scrollTop=0;
  shdL.textContent=o.left||'取消';
  shdL.onclick=o.onLeft||closeSheet;
  if(o.onSave){
    shdR.style.display='';
    shdR.textContent=o.save||'保存';
    shdR.disabled=!!o.disabled;
    shdR.onclick=o.onSave;
  }else shdR.style.display='none';
  requestAnimationFrame(function(){sheetEl.classList.add('on');});
  if(o.after)o.after();
}
function closeSheet(){sheetEl.classList.remove('on');}
function bind(id,fn){var el=document.getElementById(id);if(el)el.oninput=function(){fn(this.value);};}
function fieldRow(label,id,val,unit){
  var v=(val===0||val)?val:'';
  return '<div class="field"><label>'+label+'</label><input id="'+id+'" type="number" inputmode="decimal" value="'+esc(v)+'"><span class="u">'+unit+'</span></div>';
}
function calcRows(k,p,c,f){
  return '<div class="row"><span class="g">热量</span><span class="v mid" style="color:var(--orange)">'+k+' 千卡</span></div>'+
    '<div class="row"><span class="g">蛋白质</span><span class="v mid" style="color:var(--blue)">'+p+' 克</span></div>'+
    '<div class="row"><span class="g">碳水</span><span class="v mid" style="color:var(--green)">'+c+' 克</span></div>'+
    '<div class="row"><span class="g">脂肪</span><span class="v mid" style="color:var(--purple)">'+f+' 克</span></div>';
}

function defaultPlan(){
  var L=DB.weights.slice().sort(function(a,b){return a.date<b.date?-1:1;});
  var last=L[L.length-1];
  return{on:false,gender:'f',age:30,height:num(DB.goals.height)||165,
    weight:last?last.v:60,trainMin:0,coef:5,start:dkey(),weeks:8,floor:80};
}
function computePlan(p){
  var sex=p.gender==='m'?5:-161;
  var bmr=10*num(p.weight)+6.25*num(p.height)-5*num(p.age)+sex;
  var cals=Math.max(0,bmr+num(p.trainMin)*num(p.coef));
  return{bmr:bmr,cals:cals,
    carbs:Math.round(cals*.5/4),protein:Math.round(cals*.3/4),fat:Math.round(cals*.2/9)};
}
function weighAt(date){
  var best=null;
  DB.weights.forEach(function(w){if(w.date<=date&&(!best||w.date>best.date))best=w;});
  return best?best.v:null;
}
function buildSchedule(p){
  var c0=computePlan(p),out=[],carb=c0.carbs,cur0=p.start,today=dkey();
  var n=Math.max(1,Math.min(52,Math.round(num(p.weeks))||8));
  var floor=num(p.floor)||80;
  for(var i=0;i<n;i++){
    var end=dshift(cur0,6);
    var w0=weighAt(cur0)||weighAt(dshift(cur0,-1));
    var w1=weighAt(end);
    var drop=null,action=null;
    if(w0&&w1){
      drop=(w0-w1)/w0*100;
      if(drop>=.5&&drop<=1)action='keep';
      else if(drop>1)action='hold';
      else action='cut';
    }
    var status='future';
    if(end<today)status='done';
    else if(cur0<=today&&today<=end)status='now';
    out.push({week:i+1,start:cur0,end:end,carb:carb,w0:w0,w1:w1,drop:drop,action:action,status:status});
    if(action==='cut')carb=Math.max(floor,carb-20);
    cur0=dshift(end,1);
  }
  return out;
}
function weekTarget(k){
  var p=DB.plan;
  if(p&&p.on){
    var sch=buildSchedule(p);
    for(var i=0;i<sch.length;i++){
      if(k>=sch[i].start&&k<=sch[i].end){
        var c=computePlan(p);
        return{carbs:sch[i].carb,protein:c.protein,fat:c.fat,week:sch[i].week};
      }
    }
  }
  return{carbs:DB.goals.c,protein:DB.goals.p,fat:DB.goals.f,week:0};
} 
var todayDate=dkey();
function vToday(){
  var isT=todayDate===dkey();
  var list=DB.log.filter(function(e){return e.date===todayDate;});
  var s=sumLog(list),wt=weekTarget(todayDate),goalK=DB.goals.kcal,left=goalK-s.k,o=[];
  o.push('<div class="h1">'+(isT?'今天':dfmt(todayDate))+'<small>周'+wcn(todayDate)+' · '+list.length+' 条记录</small></div>');
  o.push('<div class="between" style="margin-bottom:14px">');
  o.push('<button class="btn sec sm" data-act="nav" data-n="-1">‹ 前一天</button>');
  o.push(isT?'<span class="gray" style="font-size:13px">'+dfmt(todayDate)+'</span>'
    :'<button class="btn sec sm" data-act="nav" data-n="0">回到今天</button>');
  o.push('<button class="btn sec sm" data-act="nav" data-n="1"'+(isT?' style="opacity:.35"':'')+'>后一天 ›</button>');
  o.push('</div>');
  o.push('<div class="card"><div class="between"><span class="caps">热量</span>'+
    '<span class="mid" style="font-size:21px">'+Math.round(s.k)+
    '<span class="gray" style="font-size:14px;font-weight:400"> / '+goalK+' 千卡</span></span></div>');
  o.push('<div style="height:11px"></div>');
  o.push(bar(s.k,goalK,'var(--orange)',10));
  o.push('<div class="tip">'+(left>=0?'还可以吃 '+Math.round(left)+' 千卡':'已超出 '+Math.round(-left)+' 千卡')+'</div></div>');
  o.push('<div class="card"><div class="between"><span class="caps">营养素</span>'+
    (wt.week?'<span class="gray" style="font-size:12px">第 '+wt.week+' 周目标</span>':'')+'</div>');
  META.forEach(function(m,i){
    var tgt=m.k==='p'?wt.protein:m.k==='c'?wt.carbs:wt.fat;
    o.push('<div style="margin-top:'+(i===0?14:16)+'px">');
    o.push('<div class="between"><span>'+m.n+'</span><span class="mid">'+r1(s[m.k])+
      '<span class="gray" style="font-weight:400;font-size:13px"> / '+r1(tgt)+' 克</span></span></div>');
    o.push('<div style="height:7px"></div>'+bar(s[m.k],tgt,m.c,7)+'</div>');
  });
  o.push('</div>');
  var s7={k:0,p:0,c:0,f:0},n7=0;
  for(var i=0;i<7;i++){
    var l=DB.log.filter(function(e){return e.date===dshift(dkey(),-i);});
    if(l.length){var x=sumLog(l);s7.k+=x.k;s7.p+=x.p;s7.c+=x.c;s7.f+=x.f;n7++;}

function costCalc(it){
  var price=num(it.price),w=num(it.weight),d=num(it.daily);
  var perG=w>0?price/w:0,perDay=perG*d,totalDays=d>0?w/d:0;
  var used=it.start?Math.max(0,ddiff(it.start,dkey())):0;
  var left=Math.max(0,totalDays-used);
  var end=(it.start&&totalDays>0)?dshift(it.start,Math.round(totalDays)):null;
  return{perG:perG,per100g:perG*100,perDay:perDay,perMonth:perDay*30,perYear:perDay*365,
    totalDays:totalDays,used:used,left:left,end:end,prog:totalDays>0?Math.min(used/totalDays,1):0};
}
function valueOf(it){
  var price=num(it.price),w=num(it.weight),p=num(it.p100),k=num(it.k100),r={};
  if(p>0&&w>0)r.perP=price/(w/100*p);
  if(k>0&&w>0)r.perK=price/(w/100*k)*100;
  return r;
}

      :d<=1?['↗','var(--orange)','小幅上升 '+r1(d)+' 公斤，留意一下最近的饮食']
      :['↑','var(--red)','上升 '+r1(d)+' 公斤，建议复盘近期摄入'];
    o.push('<div class="card"><div style="display:flex;align-items:center">');
    o.push('<div style="flex:1"><div class="s">'+dfmt(past.date)+'</div><div class="mid" style="font-size:18px;margin-top:3px">'+r1(past.v)+' kg</div></div>');
    o.push('<div style="text-align:center;padding:0 8px"><div style="font-size:20px;color:'+fb[1]+'">'+fb[0]+'</div>'+
      '<div style="font-size:13px;font-weight:700;color:'+fb[1]+'">'+(d>0?'+':'')+r1(d)+' kg</div></div>');
    o.push('<div style="flex:1;text-align:right"><div class="s">'+dfmt(last.date)+'</div><div class="mid" style="font-size:18px;margin-top:3px">'+r1(last.v)+' kg</div></div>');
    o.push('</div><div style="margin-top:16px;padding-left:12px;border-left:3px solid '+fb[1]+'">'+fb[2]+'</div></div>');
  }
  if(L.length>=2){
    var S=L.slice(-8),vs=S.map(function(x){return x.v;});
    var mx=Math.max.apply(null,vs),mn=Math.min.apply(null,vs),sp=mx-mn;
    o.push('<div class="h2">近期趋势</div><div class="card"><div style="display:flex;align-items:flex-end;gap:6px;height:118px">');
    S.forEach(function(w){
      var rt=sp>0.2?(w.v-mn)/sp:0.5,bh=15+rt*65;
      o.push('<div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end">'+
        '<span style="font-size:10px;color:var(--sec);margin-bottom:4px">'+r1(w.v)+'</span>'+
        '<div style="width:100%;max-width:24px;height:'+bh+'px;background:var(--blue);border-radius:5px"></div>'+
        '<span style="font-size:10px;color:var(--ter);margin-top:6px">'+dparse(w.date).getDate()+'</span></div>');
    });
    o.push('</div></div>');
  }
  o.push('<div class="h2">历史记录</div><div class="card pl">');
  L.slice().reverse().forEach(function(w,i,a){
    var pv=a[i+1],dd=pv?w.v-pv.v:0;
    o.push('<div class="row ck" data-act="editKg" data-id="'+w.id+'"><div class="g">'+
      '<div class="t">'+dfmt(w.date)+'</div><div class="s">'+(pv?'较上次 '+(dd>0?'+':'')+r1(dd)+' kg':'首次记录')+'</div></div>'+
      '<div class="v mid" style="color:var(--label)">'+r1(w.v)+'<span class="gray" style="font-size:12px"> kg</span></div></div>');
  });
  o.push('</div><button class="btn" data-act="addKg" style="margin-top:6px">'+ic('plus',20)+'记录体重</button>');
  return o.join('');
}
var KG=null;
function openKg(id){
  if(id){
    var w=DB.weights.filter(function(x){return x.id===id;})[0];
    if(!w)return;
    KG={id:id,date:w.date,v:w.v};
  }else KG={id:null,date:dkey(),v:''};
  drawKg();
}
function drawKg(){
  var locked=!!KG.id;
  sheet({title:KG.id?'修改体重':'记录体重',save:'保存',onSave:saveKg,disabled:!(num(KG.v)>0),
    body:'<div class="card pl">'+
      '<div class="field"><label>日期</label><input id="kgd" type="date" value="'+KG.date+'"'+(locked?' disabled':'')+
      ' style="width:150px;text-align:right'+(locked?';opacity:.5':'')+'"></div>'+
      '<div class="field"><label>体重</label><input id="kgv" type="number" inputmode="decimal" value="'+esc(KG.v)+'" placeholder="0.0"><span class="u">公斤</span></div></div>'+
      '<p class="tip">建议每天起床后、空腹、排便后称重，条件一致数据才准。</p>'+
      (KG.id?'<button class="btn dg" data-act="delKg" style="margin-top:22px">删除这条记录</button>':''),
    after:function(){
      var dEl=document.getElementById('kgd'),vEl=document.getElementById('kgv');
      if(dEl&&!locked)dEl.onchange=function(){KG.date=this.value;};
      if(vEl)vEl.oninput=function(){KG.v=this.value;canSave(num(this.value)>0&&num(this.value)<400);};
    }});
}
function saveKg(){
  var v=num(KG.v);
  if(v<=0||v>400){alert('请输入 0 到 400 之间的体重');return;}
  var ex=DB.weights.filter(function(w){return w.date===KG.date;})[0];
  if(ex)ex.v=r1(v);
  else DB.weights.push({id:uid('w'),date:KG.date,v:r1(v)});
  save();closeSheet();paint(cur);
}
function delKg(){
  if(!KG.id)return;
  if(!confirm('删除这条记录？'))return;
  DB.weights=DB.weights.filter(function(w){return w.id!==KG.id;});
  save();closeSheet();paint(cur);
}

var GOALMAP={sg_k:'kcal',sg_p:'p',sg_c:'c',sg_f:'f',sg_h:'height',sg_t:'target'};
var PLANMAP={pl_age:'age',pl_h:'height',pl_w:'weight',pl_min:'trainMin',pl_wk:'weeks',pl_fl:'floor'};
function sNum(id,label,val,unit,fn){
  return '<div class="field"><label>'+label+'</label>'+
    '<input id="'+id+'" type="number" inputmode="decimal" value="'+esc(val===0||val?val:'')+'"'+
    ' oninput="'+fn+'(\''+id+'\',this.value)"><span class="u">'+unit+'</span></div>';
}
function sDate(id,label,val){
  return '<div class="field"><label>'+label+'</label>'+
    '<input id="'+id+'" type="date" value="'+esc(val)+'" style="width:150px;text-align:right" onchange="setPlanDate(this.value)"></div>';
}
function setGoal(id,v){var k=GOALMAP[id];if(!k)return;DB.goals[k]=num(v);save();touchToday();}
function setPlan(id,v){var k=PLANMAP[id];if(!k)return;DB.plan[k]=num(v);save();updPlan();touchToday();}
function setPlanDate(v){DB.plan.start=v;save();updPlan();touchToday();}
function setSex(v){DB.plan.gender=v;save();paint(cur);touchToday();}
function setCoef(v){DB.plan.coef=num(v);save();paint(cur);touchToday();}
function togglePlan(){DB.plan.on=!DB.plan.on;save();paint(cur);touchToday();}
function doReset(){
  DB=blank();save();todayDate=dkey();
  for(var i=0;i<5;i++)paint(i);
}
var tmr=null;
function touchToday(){clearTimeout(tmr);tmr=setTimeout(function(){if(cur!==0)paint(0);},260);}

function planOutHTML(p){
  var c=computePlan(p);
  return '<div class="card pl">'+
    '<div class="row"><span class="g">基础代谢</span><span class="v mid">'+Math.round(c.bmr)+' 千卡</span></div>'+
    '<div class="row"><span class="g">起始热量</span><span class="v mid">'+Math.round(c.cals)+' 千卡</span></div>'+
    '<div class="row"><span class="g">碳水目标</span><span class="v mid" style="color:var(--green)">'+c.carbs+' 克</span></div>'+
    '<div class="row"><span class="g">蛋白质</span><span class="v mid" style="color:var(--blue)">'+c.protein+' 克</span></div>'+
    '<div class="row"><span class="g">脂肪</span><span class="v mid" style="color:var(--purple)">'+c.fat+' 克</span></div></div>';
}
function scheduleHTML(p){
  var sch=buildSchedule(p),s='<div class="card pl">';
  sch.forEach(function(w){
    var col='var(--label)';
    if(w.status==='done')col='var(--sec)';
    if(w.status==='now')col='var(--blue)';
    var act='';
    if(w.action==='keep')act='保持';
    else if(w.action==='hold')act='保持（掉太快）';
    else if(w.action==='cut')act='−20g';
    var wl='';
    if(w.drop!=null)wl='<div class="s">体重 '+r1(w.w1)+'kg · 变化 '+(w.drop>=0?'−':'+')+Math.abs(w.drop).toFixed(1)+'%</div>';
    s+='<div class="row"'+(w.status==='now'?' style="background:#E1EEF4"':'')+'>'+
      '<div class="g"><div class="t" style="color:'+col+'">第 '+w.week+' 周'+(w.status==='now'?' · 本周':'')+'</div>'+
      '<div class="s">'+dfmt(w.start)+' – '+dfmt(w.end)+'</div>'+wl+'</div>'+
      '<div style="text-align:right;flex:0 0 auto"><div class="mid" style="font-size:17px;color:'+col+'">'+w.carb+
      '<span class="gray" style="font-size:12px"> g</span></div>'+(act?'<div class="s">'+act+'</div>':'')+'</div></div>';
  });
  return s+'</div>';
}
function updPlan(){
  var p=DB.plan;if(!p)return;
  var a=document.getElementById('planout');if(a)a.innerHTML=planOutHTML(p);
  var b=document.getElementById('plantable');if(b)b.innerHTML=scheduleHTML(p);
}
function vSet(){
  if(!DB.plan){DB.plan=defaultPlan();save();}
  var g=DB.goals,p=DB.plan;
  var own=DB.foods.filter(function(f){return f.own;}).length,o=[];
  o.push('<div class="h1">设置</div>');
  o.push('<div class="h2">每日目标</div><div class="card pl">'+
    sNum('sg_k','热量',g.kcal,'千卡','setGoal')+sNum('sg_p','蛋白质',g.p,'克','setGoal')+
    sNum('sg_c','碳水',g.c,'克','setGoal')+sNum('sg_f','脂肪',g.f,'克','setGoal')+'</div>');
  o.push('<p class="tip">开启下面的碳水计划后，今日页会自动改用计划里的目标。</p>');
  o.push('<div class="h2">碳水渐降计划</div>');
  o.push('<div class="card pl"><div class="row"><div class="g">'+
    '<div class="t">启用计划</div><div class="s">开启后，今日页碳水目标自动跟随本周</div></div>'+
    '<button class="btn sm '+(p.on?'':'sec')+'" data-act="togglePlan">'+(p.on?'已开启':'已关闭')+'</button></div></div>');
  var zero=num(p.trainMin)===0;
  o.push('<div class="card pl">'+
    '<div class="field"><label>性别</label><div style="display:flex;gap:6px;flex:0 0 auto">'+
      '<button class="btn sm '+(p.gender==='f'?'':'sec')+'" data-act="setSex" data-v="f">女</button>'+
      '<button class="btn sm '+(p.gender==='m'?'':'sec')+'" data-act="setSex" data-v="m">男</button>'+
    '</div></div>'+
    sNum('pl_age','年龄',p.age,'岁','setPlan')+
    sNum('pl_h','身高',p.height,'厘米','setPlan')+
    sNum('pl_w','体重',p.weight,'公斤','setPlan')+
    sNum('pl_min','训练分钟',p.trainMin,'分','setPlan')+
    '<div class="field" style="'+(zero?'opacity:.42;flex-wrap:wrap':'')+'"><label>训练系数</label>'+
      '<div style="display:flex;gap:6px;flex:0 0 auto;'+(zero?'pointer-events:none':'')+'">'+
        [['5','新手'],['8','普通'],['10','高强']].map(function(x){
          return '<button class="btn sm '+(num(p.coef)===num(x[0])?'':'sec')+
            '" data-act="setCoef" data-v="'+x[0]+'">'+x[0]+'</button>';
        }).join('')+
      '</div>'+
      (zero?'<div style="flex:0 0 100%;font-size:12px;color:var(--sec);text-align:right;padding-top:5px">不运动 · 无需设置</div>':'')+
    '</div>'+
    sDate('pl_start','开始日期',p.start)+
    sNum('pl_wk','持续周数',p.weeks,'周','setPlan')+
    sNum('pl_fl','碳水下限',p.floor,'克','setPlan')+
  '</div>');
  o.push('<div class="h2" style="margin-top:0">自动计算（5:3:2 配比）</div>');
  o.push('<div id="planout">'+planOutHTML(p)+'</div>');
  o.push('<div class="h2">时间表</div>');
  o.push('<div id="plantable">'+scheduleHTML(p)+'</div>');
  o.push('<p class="tip">每周称重一次，系统自动判断：降 0.5%～1% 保持 · 没达标减 20g 碳水 · 降太快保持当前。</p>');
  o.push('<div class="h2">个人信息</div><div class="card pl">'+
    sNum('sg_h','身高',g.height,'厘米','setGoal')+sNum('sg_t','目标体重',g.target,'公斤','setGoal')+'</div>');
  o.push('<p class="tip">填了身高，「体重」页会显示 BMI 和体型评价。</p>');
  o.push('<div class="h2">数据概览</div><div class="card pl">'+
    '<div class="row"><span class="g">食物库</span><span class="v">'+DB.foods.length+' 种 · 自定义 '+own+'</span></div>'+
    '<div class="row"><span class="g">饮食记录</span><span class="v">'+DB.log.length+' 条</span></div>'+
    '<div class="row"><span class="g">体重记录</span><span class="v">'+DB.weights.length+' 条</span></div>'+
    '<div class="row"><span class="g">商品</span><span class="v">'+DB.costs.length+' 个</span></div></div>');
  o.push('<div class="h2">数据管理</div><div class="card pl">'+
    '<div class="row ck" data-act="openExport"><div class="g"><div class="t">导出数据</div>'+
      '<div class="s">复制到备忘录，换手机时用</div></div><div class="ar">'+ic('chev',18)+'</div></div>'+
    '<div class="row ck" data-act="openImport"><div class="g"><div class="t">导入数据</div>'+
      '<div class="s">粘贴之前导出的内容恢复</div></div><div class="ar">'+ic('chev',18)+'</div></div>'+
    '<div class="row ck" data-act="askReset"><div class="g">'+
      '<div class="t" style="color:var(--red)">清空所有数据</div>'+
      '<div class="s">恢复初始状态，无法撤销</div></div><div class="ar">'+ic('chev',18)+'</div></div></div>');
  o.push('<div class="h2">关于</div><div class="card pl">'+
    '<div class="row"><span class="g">版本</span><span class="v">1.0.0</span></div>'+
    '<div class="row"><span class="g">数据存储</span><span class="v">仅保存在本机</span></div>'+
    '<div class="row"><span class="g">每月按</span><span class="v">30 天计算</span></div></div>');
  o.push('<p style="font-size:12px;color:var(--ter);text-align:center;margin:24px 0 0">记录是自律的开始 ♥</p>');
  return o.join('');
}

function openExport(){
  var txt=JSON.stringify(DB);
  sheet({title:'导出数据',left:'关闭',onLeft:closeSheet,
    body:'<p class="tip" style="margin-top:0">点下面按钮复制，然后新建一条备忘录粘进去保存。换手机或数据丢了时，用「导入数据」恢复。</p>'+
      '<div class="card" style="padding:10px"><textarea id="exp" readonly style="width:100%;height:200px;border:none;background:none;font-size:12px;font-family:ui-monospace,Menlo,monospace;line-height:1.5;resize:none">'+
      esc(txt)+'</textarea></div>'+
      '<button class="btn" data-act="copyExp">复制全部</button>',
    after:function(){var t=document.getElementById('exp');if(t)t.onclick=function(){this.select();};}});
}
function copyExp(){
  var t=document.getElementById('exp');if(!t)return;
  t.removeAttribute('readonly');t.select();t.setSelectionRange(0,999999);
  var ok=false;
  try{ok=document.execCommand('copy');}catch(e){}
  if(!ok&&navigator.clipboard){navigator.clipboard.writeText(t.value);ok=true;}
  t.setAttribute('readonly','readonly');
  alert(ok?'已复制，去备忘录粘贴保存':'请长按框内文字，手动全选复制');
}
function openImport(){
  sheet({title:'导入数据',left:'关闭',onLeft:closeSheet,
    body:'<p class="tip" style="margin-top:0">把之前导出的整段内容粘贴到下面，然后点导入。</p>'+
      '<div class="card" style="padding:10px"><textarea id="imp" placeholder="在这里粘贴数据…" style="width:100%;height:200px;border:none;background:none;font-size:12px;font-family:ui-monospace,Menlo,monospace;line-height:1.5;resize:none"></textarea></div>'+
      '<button class="btn" data-act="doImport">导入</button>'+
      '<p class="tip" style="color:var(--red)">导入会覆盖当前所有数据。</p>'});
}
function doImport(){
  var t=document.getElementById('imp');if(!t)return;
  var d;
  try{d=JSON.parse(t.value.trim());}
  catch(e){alert('数据格式不对，请检查是否复制完整');return;}
  if(!d||!d.foods){alert('这不像是本 App 的数据');return;}
  DB=d;
  ['goals','foods','log','costs','weights'].forEach(function(k){if(!DB[k])DB[k]=blank()[k];});
  save();closeSheet();todayDate=dkey();
  for(var i=0;i<5;i++)paint(i);
  alert('导入成功');
}
function askReset(){
  if(!confirm('确定清空所有数据吗？此操作无法撤销。'))return;
  doReset();
}

var ACT={
  nav:function(d){
    var n=+d.n;
    if(n===1&&todayDate===dkey())return;
    todayDate=n===0?dkey():dshift(todayDate,n);
    paint(0);
  },
  addLog:function(){openLog(null);},
  editLog:function(d){openLog(d.id);},
  lgPick:function(d){LG.step='amt';LG.food=DB.foods.filter(function(f){return f.id===d.id;})[0];LG.grams=100;drawLog();},
  lgG:function(d){LG.grams=d.v;drawLog();},
  lgDel:delLog,
  addFood:function(){openFood(null);},
  editFood:function(d){openFood(d.id);},
  delFood:delFood,
  addCost:function(){openCost(null);},
  editCost:function(d){openCost(d.id);},
  delCost:delCost,
  addKg:function(){openKg(null);},
  editKg:function(d){openKg(d.id);},
  delKg:delKg,
  togglePlan:togglePlan,
  setSex:function(d){setSex(d.v);},
  setCoef:function(d){setCoef(d.v);},
  openExport:openExport,
  copyExp:copyExp,
  openImport:openImport,
  doImport:doImport,
  askReset:askReset
};

var VIEWS={today:vToday,foods:vFoods,cost:vCost,weight:vWeight,set:vSet};

function placeholderHTML(i){
  return '<div class="h1">'+TABS[i].n+'<small>正在加载…</small></div>'+
    '<div class="card"><div class="empty">'+ic('bowl',38)+'<b>第 '+(i+1)+' 页</b></div></div>';
}
function paint(i){
  var el=pageEls[i];
  var fn=VIEWS[TABS[i].k];
  var top=el.scrollTop;
  el.innerHTML=fn?fn():placeholderHTML(i);
  el.scrollTop=top;
}

document.getElementById('pages').addEventListener('click',function(e){
  var t=e.target.closest('[data-act]');
  if(!t)return;
  var fn=ACT[t.dataset.act];
  if(fn){e.preventDefault();fn(t.dataset,t,e);}
});
sbd.addEventListener('click',function(e){
  var t=e.target.closest('[data-act]');
  if(!t)return;
  var fn=ACT[t.dataset.act];
  if(fn){e.preventDefault();fn(t.dataset,t,e);}
});

for(var _i=0;_i<5;_i++)paint(_i);
</script>
</body>
