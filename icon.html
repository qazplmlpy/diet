<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>图标</title>
<style>
body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#EDEAEB;font-family:-apple-system,"PingFang SC",sans-serif;text-align:center;padding:30px;box-sizing:border-box}
img{width:224px;height:224px;display:block;border-radius:50px;box-shadow:0 14px 30px rgba(150,120,130,.16)}
h2{color:#A8929C;font-size:16px;margin:34px 0 8px}
p{color:#9A9A9F;font-size:13px;margin:0}
</style>
</head>
<body>
<img id="ico">
<h2>长按 → 存储到「照片」</h2>
<p>然后上传到 GitHub</p>
<script>
var S=1024,c=S/2,cv=document.createElement('canvas');
cv.width=cv.height=S;
var g=cv.getContext('2d');
var bg=g.createLinearGradient(0,0,S,S);
bg.addColorStop(0,'#FFFFFF');bg.addColorStop(.55,'#FFFFFF');bg.addColorStop(1,'#FBF3F5');
g.fillStyle=bg;g.fillRect(0,0,S,S);
var hl=g.createRadialGradient(S*.84,S*.88,0,S*.84,S*.88,S*.7);
hl.addColorStop(0,'rgba(248,228,233,.5)');hl.addColorStop(1,'rgba(248,228,233,0)');
g.fillStyle=hl;g.fillRect(0,0,S,S);
g.lineWidth=S*.068;g.lineCap='round';
var wg=g.createLinearGradient(c-S*.295,0,c+S*.295,0);
wg.addColorStop(0,'#BFBFC7');wg.addColorStop(.5,'#D6D6DC');wg.addColorStop(1,'#BFBFC7');
g.strokeStyle=wg;
g.beginPath();g.ellipse(c,S*.618,S*.295,S*.25,0,0,Math.PI);g.stroke();
var hc=S/2,hy=S*.342,hr=S*.112;
var halo=g.createRadialGradient(hc,hy,hr*.85,hc,hy,hr*1.15);
halo.addColorStop(0,'rgba(214,208,190,.3)');halo.addColorStop(1,'rgba(214,208,190,0)');
g.fillStyle=halo;g.beginPath();g.arc(hc,hy,hr*1.15,0,Math.PI*2);g.fill();
var dg=g.createRadialGradient(hc-hr*.2,hy-hr*.22,hr*.08,hc,hy,hr);
dg.addColorStop(0,'#FDFBF4');dg.addColorStop(.5,'#F9F5E8');dg.addColorStop(1,'#E5DDC2');
g.fillStyle=dg;g.beginPath();g.arc(hc,hy,hr,0,Math.PI*2);g.fill();
document.getElementById('ico').src=cv.toDataURL('image/png');
</script>
</body>
</html>
