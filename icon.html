<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
body{margin:0;padding:44px 20px;background:#EDEAEB;
font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;
display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh}
img{width:224px;height:224px;display:block;filter:drop-shadow(0 14px 30px rgba(150,120,130,.16))}
h2{color:#A8929C;font-size:16px;font-weight:600;margin:34px 0 8px}
p{color:#9A9A9F;font-size:13px;margin:0}
</style>
</head>
<body>
<img id="ico">
<h2>长按 → 存储到「照片」</h2>
<p>然后上传到 GitHub</p>
<canvas id="cv" style="display:none"></canvas>
<script>
(function(){
var S=1024,cv=document.getElementById('cv');cv.width=cv.height=S;
var g=cv.getContext('2d');

function shape(){
  var r=S*0.2237,k=0.5523;
  g.beginPath();g.moveTo(r,0);g.lineTo(S-r,0);
  g.bezierCurveTo(S-r+r*k,0,S,r-r*k,S,r);
  g.lineTo(S,S-r);
  g.bezierCurveTo(S,S-r+r*k,S-r+r*k,S,S-r,S);
  g.lineTo(r,S);
  g.bezierCurveTo(r-r*k,S,0,S-r+r*k,0,S-r);
  g.lineTo(0,r);
  g.bezierCurveTo(0,r-r*k,r-r*k,0,r,0);
  g.closePath();
}

g.save();

/* ===== 背景：白 → 淡粉 ===== */
var bg=g.createLinearGradient(S*.1,0,S*.9,S);
bg.addColorStop(0,'#FFFFFF');
bg.addColorStop(.5,'#FEFBFC');
bg.addColorStop(1,'#FAF2F4');
g.fillStyle=bg;
g.fillRect(0,0,S,S);

var gl=g.createRadialGradient(S*.85,S*.88,0,S*.85,S*.88,S*.75);
gl.addColorStop(0,'rgba(248,228,233,.42)');
gl.addColorStop(1,'rgba(248,228,233,0)');
g.fillStyle=gl;
g.fillRect(0,0,S,S);

/* ===== 碗：浅灰 ===== */
var bcx=S*.5,bcy=S*.618,brx=S*.295,bry=S*.250,bw=S*.068;

var wg=g.createLinearGradient(bcx-brx,0,bcx+brx,0);
wg.addColorStop(0,'#BFBFC7');
wg.addColorStop(.5,'#D4D4DA');
wg.addColorStop(1,'#BFBFC7');
g.strokeStyle=wg;
g.lineWidth=bw;
g.lineCap='round';
g.beginPath();g.ellipse(bcx,bcy,brx,bry,0,0,Math.PI);g.stroke();

/* ===== 圆点：米黄渐变 ===== */
var dcx=S*.5,dcy=S*.342,dr=S*.112;

var halo=g.createRadialGradient(dcx,dcy,dr*.86,dcx,dcy,dr*1.14);
halo.addColorStop(0,'rgba(214,208,190,.28)');
halo.addColorStop(.6,'rgba(214,208,190,.1)');
halo.addColorStop(1,'rgba(214,208,190,0)');
g.fillStyle=halo;
g.beginPath();g.arc(dcx,dcy,dr*1.14,0,Math.PI*2);g.fill();

var dg=g.createRadialGradient(
  dcx-dr*.2, dcy-dr*.22, dr*.1,
  dcx, dcy, dr
);
dg.addColorStop(0,'#FDFBF4');
dg.addColorStop(.5,'#F9F5E8');
dg.addColorStop(.82,'#F2EBD6');
dg.addColorStop(1,'#E5DDC2');
g.fillStyle=dg;
g.beginPath();g.arc(dcx,dcy,dr,0,Math.PI*2);g.fill();

/* 磨砂颗粒 */
try{
  var id=g.getImageData(0,0,S,S),d=id.data;
  for(var i=0;i<d.length;i+=4){
    var n=(Math.random()-.5)*13;
    d[i]+=n;d[i+1]+=n;d[i+2]+=n;
  }
  g.putImageData(id,0,0);
}catch(e){}

g.restore();
document.getElementById('ico').src=cv.toDataURL('image/png');
})();
</script>
</body>
</html>
